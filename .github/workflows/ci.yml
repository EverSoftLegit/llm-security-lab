name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q

  go-verifier-integration:
    # Builds the Go verifier, starts the lab, and proves each challenge is
    # exploitable without guardrails and blocked with them — end to end.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: python -m pip install -r requirements.txt
      - name: Build verifier
        run: go build -o verifier-bin ./verifier
      - name: Start the lab
        run: |
          PORT=5001 python -m backend.app &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:5001/api/challenges && break; sleep 1; done
      - name: Run the verifier
        run: ./verifier-bin -target http://127.0.0.1:5001
